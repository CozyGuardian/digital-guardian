[package]
name = "digital-guardian"
version = "0.1.0"
edition = "2021"

[lib]
name = "digital_guardian_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "digital-guardian"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
thiserror = "1"
rand = "0.8"

[features]
default = ["lite"]
bundled = []
lite = []
